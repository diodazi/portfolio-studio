<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地内容管理 — Portfolio</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/fonts/fonts.css"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/manage/manage.css"><script type="module" src="/manage/manage.js"></script><link rel="stylesheet" href="/visual-system.css"><link rel="stylesheet" href="/magazine.css"><link rel="stylesheet" href="/manage/magazine-editor.css"><link rel="stylesheet" href="/manage/workflow.css"><link rel="stylesheet" href="/manage/game-review-editor.css"><link rel="stylesheet" href="/manage/game-media-search.css"></head>
<body class="manager"><header class="manager-header"><a class="wordmark" href="/">Portfolio<span>.</span><small>内容管理</small></a><button id="open-library" class="subtle" type="button">素材库</button><button id="publish-center" class="publish-center" type="button">待发布 · 0</button><span id="connection" class="connection">正在连接本机…</span><a href="/?edit=1" target="_blank" rel="noopener">在页面中编辑 ↗</a><a href="/" target="_blank" rel="noopener">访客视图 ↗</a></header>
<div class="manager-layout"><aside class="manager-sidebar"><p>网站板块</p><nav id="manager-nav" aria-label="管理板块"></nav><div class="manager-tip">编辑自动保存为草稿。<br>点击发布后更新访客内容。<br>上线时构建并部署公开文件。</div><button id="migrate" class="subtle" hidden>迁移旧预览素材</button></aside>
<main class="manager-main"><header class="workspace-head"><div><p class="section-label">本地工作台</p><h1 id="section-heading">内容管理</h1></div><a id="section-preview" class="text-link" href="/" target="_blank" rel="noopener">查看已发布 ↗</a></header><p id="message" class="manager-message" role="status" aria-live="polite">正在读取内容…</p>
<p id="autosave-status" class="autosave-status" role="status" aria-live="polite"></p><div id="mode-tabs" class="mode-tabs" role="group" aria-label="编辑内容类型"><button id="content-mode" aria-pressed="true">作品内容</button><button id="copy-mode" aria-pressed="false">板块文字</button></div>
<section id="settings-panel" class="surface" hidden><form novalidate id="settings-form"><div id="settings-fields" class="settings-fields"></div><div class="save-row"><button type="submit" class="primary-button">保存草稿</button><button type="button" class="publish-button" data-publish-current>发布此板块</button><button type="button" class="subtle" data-history>版本历史</button><button type="button" class="subtle" data-discard hidden>丢弃草稿</button></div></form></section>
<section id="collection-panel"><div class="collection-actions"><button id="new-entry" class="primary-button">＋ 新建内容</button><label id="bulk-label" class="upload-button">批量上传素材<input id="bulk-upload" type="file" multiple></label><span id="record-total"></span></div><div class="entry-layout"><aside class="entry-list" id="entry-list" aria-label="已有内容"></aside><form novalidate id="entry-form" class="surface"><div class="entry-form-head"><h2 id="entry-heading">新建内容</h2><span id="editing-state">未保存</span></div><div id="entry-fields"></div><div class="save-row"><button type="submit" class="primary-button">保存草稿</button><button type="button" class="publish-button" data-publish-current>发布此条</button><button type="button" class="subtle" data-history>版本历史</button><button type="button" class="subtle" data-discard hidden>丢弃草稿</button><button id="remove-entry" type="button" class="danger" hidden>移除内容</button><button id="move-up" type="button" class="subtle" hidden>上移</button><button id="move-down" type="button" class="subtle" hidden>下移</button></div></form></div></section>
</main></div></body></html>
