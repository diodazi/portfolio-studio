# Preview site: confirm this port is unused before enabling.
# Place inside the nginx http context (e.g. /etc/nginx/sites-available/portfolio-portfolio).
server {
    listen 8080;
    server_name _;
    root /srv/portfolio-portfolio/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    sendfile on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Deploy dist only. The workstation manager and write APIs are never proxied.
    location ^~ /manage { return 404; }
    location ^~ /api { return 404; }
    location ~* (?:^|/)[\w-]*editor(?:\.|/) { return 404; }

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:html|json|js|css)$ {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|woff2|mp4|webm|mp3|wav|ogg|m4a|flac|pdf)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ /\. { deny all; }
}
