<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>摄影作品 — 站点作者 Portfolio</title><link rel="icon" href="./assets/favicon.svg"><link rel="stylesheet" href="./assets/fonts/fonts.css"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./visual-system.css"><link rel="stylesheet" href="./photography.css"><script type="module" src="./photography-page.js"></script></head>
<body class="photography-page"><a class="skip" href="#photography-collection">跳到摄影作品</a><header class="journal-bar"><a class="wordmark" href="./" aria-label="站点作者首页">Portfolio<span>.</span></a><a href="./#photography">← 返回首页摄影</a></header>
<main class="photography-index" id="photography-collection"><div class="section-heading"><div><p class="section-label">摄影作品</p><h1>把目光，留给画面。</h1></div><p class="section-intro">人、城市和舞台。<br>每一次快门，都是一次观看。</p></div>
<div class="collection-toolbar"><div class="filters" role="group" aria-label="摄影分类"><button data-category="all" aria-pressed="true">全部</button><button data-category="portrait" aria-pressed="false">人像</button><button data-category="street" aria-pressed="false">街头</button><button data-category="stage" aria-pressed="false">演出现场</button></div><button class="photo-shuffle" id="shuffle-photos" type="button"><span aria-hidden="true">↻</span>重新排列</button></div>
<p id="collection-status" class="collection-status" role="status">正在载入摄影作品…</p><div id="photo-grid" class="photo-grid photo-mosaic"></div><div id="photo-empty" class="photo-empty" hidden>摄影作品正在整理。</div><button class="photo-more" id="load-more-photos" type="button" hidden>查看更多</button><noscript>请开启 JavaScript 查看摄影作品。</noscript></main>
<dialog id="work-dialog" aria-labelledby="work-title"><div class="dialog-shell"><div class="dialog-top"><span id="work-counter"></span><button class="icon-button" data-close aria-label="关闭作品查看">×</button></div><div class="work-stage" id="work-stage"></div><div class="work-info"><div><h2 id="work-title"></h2><p id="work-description"></p></div><div class="work-actions"><button id="zoom-work" class="glass-button">查看原图</button><button id="prev-work" class="icon-button" aria-label="上一件作品">←</button><button id="next-work" class="icon-button" aria-label="下一件作品">→</button></div></div></div></dialog>
</body></html>
