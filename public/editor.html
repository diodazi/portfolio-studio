<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材预览工作台 — Portfolio</title><link rel="icon" href="./assets/favicon.svg"><link rel="stylesheet" href="./assets/fonts/fonts.css"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./editor.css"><script type="module" src="./editor.js"></script></head><body class="editor-body"><header class="editor-header"><a class="wordmark" href="./">Portfolio<span>.</span><small>素材预览工作台</small></a><a class="text-link" href="./" target="_blank" rel="noopener">打开网站预览 ↗</a></header><main class="editor-main"><div class="editor-intro"><p class="section-label">第一阶段 · 本地内容预览</p><h1>让真实作品，<br>进入画面。</h1><p>选入素材后，在首页查看展墙、胶片和媒体播放效果。<br><strong>文件只保存到当前浏览器，不会上传到服务器。</strong>清理浏览器数据会移除这些预览。</p></div><p style="margin:0 0 32px"><a class="text-link" href="./journal-editor.html">管理游戏履历与观影片单 ↗</a></p><div class="editor-layout"><form id="import-form" class="editor-panel"><h2>添加素材</h2><label for="files" class="drop-area" id="drop-area"><span>选择或拖入照片、视频、音频</span><small>JPG / PNG / WebP / AVIF · MP4 / WebM · MP3 / WAV / OGG<br>每个文件不超过 100 MB</small><input id="files" name="files" type="file" accept="image/jpeg,image/png,image/webp,image/avif,video/mp4,video/webm,audio/mpeg,audio/wav,audio/ogg,audio/mp4,audio/flac" multiple required></label><p id="selected-files" class="help" aria-live="polite">尚未选择文件</p><label for="category">照片分类</label><select id="category" name="category"><option value="portrait">人像</option><option value="street">街头</option><option value="stage">演出现场</option></select><p class="help">视频、音频会自动进入“影像与声音”区域。</p><button class="primary-button" type="submit" id="import-button">加入本地预览</button><p id="import-status" class="form-status" role="status"></p></form><section class="editor-panel saved-panel" aria-labelledby="saved-heading"><div class="saved-heading"><h2 id="saved-heading">已加入的素材</h2><button id="export-manifest" class="glass-button">导出作品清单</button></div><p class="help">可修改名称、说明、分类和封面取景。修改后刷新首页即可看到效果。作品清单不包含媒体文件。</p><div id="saved-works"></div><p id="saved-empty" class="empty-editor">还没有素材。先从左侧选入一组照片。</p></section></div></main><div id="toast" class="toast" role="status" aria-live="polite"></div></body></html>
