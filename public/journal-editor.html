<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>游戏与观影工作台 — Portfolio</title><link rel="icon" href="./assets/favicon.svg"><link rel="stylesheet" href="./assets/fonts/fonts.css"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./editor.css"><link rel="stylesheet" href="./journal-editor.css"><script type="module" src="./journal-editor.js"></script></head>
<body class="editor-body"><header class="editor-header"><a class="wordmark" href="./">Portfolio<span>.</span></a><a class="text-link" href="./editor.html">返回素材工作台</a></header>
<main class="editor-main"><div class="editor-intro"><h1>游戏与观影工作台</h1><p>保存后会更新本机的网站内容。已部署的网站需要重新构建、上传后才会同步。</p></div>
<div class="editor-layout"><aside class="editor-panel"><label for="kind">管理板块</label><select id="kind" disabled><option value="games">游戏评价</option><option value="cinema">电影手记</option></select><p><a id="preview" class="text-link" href="./games.html" target="_blank" rel="noopener">预览游戏履历 ↗</a></p>
<div class="j-list-head"><h2>已有记录</h2><button id="new-entry" type="button" class="small-button" disabled>＋ 新建</button></div><div id="saved-list"></div></aside>
<form id="entry-form" class="editor-panel"><fieldset disabled><legend id="form-heading">添加游戏记录</legend>
<label for="title" id="title-label">游戏名称（必填）</label><input id="title" required maxlength="180" autocomplete="off">
<div id="game-fields"><label for="platform">平台</label><input id="platform" maxlength="100" placeholder="例如：PC、Switch"><label for="status">游玩状态</label><select id="status"><option value="">不填写</option><option>在玩</option><option>已通关</option><option>已游玩</option><option>搁置</option></select><label for="hours">累计游玩时长（小时）</label><input id="hours" type="number" min="0" max="999999.9" step=".1"></div>
<div id="film-fields" hidden><label for="director">导演</label><input id="director" maxlength="180"><label for="year">上映年份</label><input id="year" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"><label for="rating">个人评分</label><select id="rating"><option value="">不评分</option><option value="1">1 星</option><option value="2">2 星</option><option value="3">3 星</option><option value="4">4 星</option><option value="5">5 星</option></select></div>
<label for="date" id="date-label">游玩日期</label><input id="date" type="date">
<label for="note" id="note-label">游玩经历与感想</label><textarea id="note" maxlength="12000" rows="5"></textarea>
<details><summary>添加封面（可选）</summary><label for="cover">已放入 assets/media 的图片路径</label><input id="cover" placeholder="./assets/media/cover.webp" maxlength="350"><small>支持 JPG、PNG、WebP、AVIF。</small></details>
<div class="edit-actions"><button class="primary-button" type="submit">保存记录</button><button id="remove" class="small-button danger-button" type="button" hidden>删除记录</button></div></fieldset><p id="message" class="form-status" role="status">正在读取…</p></form></div></main></body></html>
